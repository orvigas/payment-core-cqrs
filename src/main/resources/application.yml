spring:
  application:
    name: payment-core
  profiles:
    active: local

  data:
    mongodb:
      auto-index-creation: true
      database: payment-core
      uri: mongodb://localhost:27017/payment-core

  # The driver refuses to encode a bare UUID at all unless this is set
  # explicitly - the historical per-language encodings (JAVA_LEGACY,
  # C_SHARP_LEGACY, ...) are mutually incompatible byte layouts, so newer
  # driver versions require an explicit, deliberate choice rather than
  # silently picking one. STANDARD is the cross-driver RFC 4122 encoding.
  # Every typed id in shared.id wraps a UUID, so this affects any document
  # that stores one directly - PaymentIdempotencyDocument here, and the
  # event store/token store collections Axon itself writes to. Note this
  # lives under spring.mongodb, not spring.data.mongodb: Boot 4.0 deprecated
  # (error level) spring.data.mongodb.uuid-representation in favor of this key.
  mongodb:
    representation:
      uuid: standard

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/payment_core
    username: payment_user
    password: payment_password
    pool:
      max-size: 20
      min-idle: 5
      validation-query: SELECT 1

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 2147483647
      properties:
        # Idempotence plus acks=all guarantees a retry never reorders or
        # duplicates a record within a partition - required for the payment
        # topics, since ordering per payment id is load-bearing for the read
        # projection (T-005). delivery.timeout.ms bounds how long the
        # producer keeps retrying a single record before giving up.
        enable.idempotence: true
        delivery.timeout.ms: 120000
        linger.ms: 10
        batch.size: 16384
        # The eventType field on every payload already discriminates the
        # payload shape; a Java-FQCN type header would leak an internal
        # package name onto a wire contract other services may consume.
        spring.json.add.type.headers: false
    consumer:
      bootstrap-servers: localhost:9092
      group-id: payment-core-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
      auto-offset-reset: earliest
      enable-auto-commit: true

com:
  orvigas:
    security:
      jwt:
        secret: ${JWT_SECRET}
        expiration: ${JWT_EXPIRATION:15m}
        issuer: ${JWT_ISSUER:payment-core}
        audience: ${JWT_AUDIENCE:payment-core}
      users:
        default:
          username: ${APP_USER_NAME:admin}
          password: ${APP_USER_PASSWORD_HASH:}
          roles:
            - USER

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

  jpa:
    open-in-view: false

  webflux:
    base-path: /api/v1

axon:
  eventhandling:
    processors:
      events:
        mode: subscribing
      # Tracking mode is load-bearing here, not a style choice: a tracking
      # processor reads events back out of the Mongo event store rather than
      # receiving them in-process from the committing unit of work, so it
      # physically cannot observe an event before the store's append has
      # durably succeeded. See axon-subscribing-vs-tracking-durability.md.
      payment-kafka-publisher:
        mode: tracking
  serializer:
    events: jackson
    messages: jackson
  axonserver:
    enabled: false
  mongo:
    event-store:
      enabled: true
    token-store:
      enabled: true
    saga-store:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
    brave:
      span-joining-enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO
    com.orvigas: DEBUG
    org.springframework.security: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  logback:
    loki-config:
      enabled: true
      url: http://localhost:3100/loki/api/v1/push

server:
  port: 8080
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

resilience4j:
  ratelimiter:
    instances:
      login:
        register-health-indicator: true
        limit-refresh-period: 1m
        limit-for-period: 5
      payment:
        register-health-indicator: true
        limit-refresh-period: 1s
        limit-for-period: 100
  circuitbreaker:
    instances:
      payment-provider:
        register-health-indicator: true
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        minimum-number-of-calls: 5
  retry:
    instances:
      payment-provider:
        max-attempts: 3
        wait-duration: 1000
  timelimiter:
    instances:
      payment-provider:
        cancel-running-future: true
        timeout-duration: 10s
