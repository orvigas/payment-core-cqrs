# Self-contained configuration for integration tests started through
# AbstractIntegrationTest. This deliberately replaces src/main/resources/
# application.yml (via spring.config.location) rather than layering on top
# of it: that file's spring.jackson.serialization.write-dates-as-timestamps
# key does not exist under Jackson 3's SerializationFeature enum (Spring
# Boot 4.1 moved Jackson binding to the tools.jackson.databind package,
# which dropped that constant), so any context that loads it fails to
# start. See the T-001 handoff log - fixing that key is main-application
# config, out of this task's scope, but a real bug worth fixing separately.
#
# Datasource/Mongo connection details come from @ServiceConnection against
# the running Testcontainers instances, not from static properties here.

spring:
  application:
    name: payment-core

  webflux:
    base-path: /api/v1

  # @ServiceConnection supplies host/port/credentials from the Testcontainers
  # instance but not this - without it, encoding any typed id (they all wrap
  # UUID) fails with "the uuidRepresentation has not been specified". This is
  # spring.mongodb.representation.uuid, not the deprecated (error-level)
  # spring.data.mongodb.uuid-representation - see the T-007 handoff log.
  mongodb:
    representation:
      uuid: standard

  # This file replaces application.yml wholesale, so its Kafka producer
  # config (JsonSerializer, idempotence) has to be repeated here - without
  # it, Boot's Kafka autoconfiguration falls back to StringSerializer, and
  # PaymentEventKafkaPublisher's payload records blow up trying to serialize
  # as a String. bootstrap-servers itself comes from @TestPropertySource in
  # whichever test class adds @EmbeddedKafka.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

com:
  orvigas:
    security:
      jwt:
        secret: test-harness-secret-key-minimum-256-bits-required-for-hmac-sha
        expiration: 15m
        issuer: payment-core-test
        audience: payment-core-test

axon:
  eventhandling:
    processors:
      events:
        mode: subscribing
      payment-kafka-publisher:
        mode: tracking
  serializer:
    events: jackson
    messages: jackson
  axonserver:
    enabled: false
  mongo:
    event-store:
      enabled: true
    token-store:
      enabled: true
    saga-store:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

resilience4j:
  ratelimiter:
    instances:
      login:
        limit-refresh-period: 1m
        limit-for-period: 5
      payment:
        limit-refresh-period: 1s
        limit-for-period: 100

logging:
  level:
    root: WARN
    com.orvigas: INFO
