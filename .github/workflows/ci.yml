name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify runs the full gate: tests, ArchUnit rules, and the JaCoCo
      # 95% instruction-coverage floor. Testcontainers uses the runner's
      # Docker daemon.
      - name: Build and verify
        run: mvn -B --no-transfer-progress verify
